name: ClashForge

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run_demo_actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.10'

      - name: Install requirements.txt
        run: |
          pip install -r config/requirements.txt

      - name: Run ClashForge.py
        env:
          INPUT_URLS: ${{ secrets.INPUT_URLS }}
        run: |
          python config/ClashForge.py

      - name: Checkout target repository
        run: |
          TARGET_URL="https://${{ secrets.BOT }}:x-oauth-basic@github.com/${{ secrets.TARGET_REPO }}.git"
          echo "Cloning target repository from $TARGET_URL (sensitive info masked)"
          git clone "$TARGET_URL" target-repo
          cd target-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Copy generated file to target repository
        run: |
          cp clash.yaml target-repo/clash.yaml

      - name: Commit and push to target repository
        run: |
          cd target-repo
          git add clash.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit in target repository"
          else
            git commit -m "Update clash.yaml"
            TARGET_URL="https://${{ secrets.BOT }}:x-oauth-basic@github.com/${{ secrets.TARGET_REPO }}.git"
            git push "$TARGET_URL"
            echo "Successfully pushed changes to target repository"
          fi
        continue-on-error: true

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 3

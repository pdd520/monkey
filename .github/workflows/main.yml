name: free-v2ray-node

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    paths-ignore:
      - '**'
  workflow_dispatch:

jobs:
  run_demo_actions:
    runs-on: ubuntu-latest
    env:
      CONFIG_URL: ${{ secrets.CONFIG_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.10'

      - name: Install requirements.txt
        run: |
          pip install -r requirements.txt

      - name: Run main.py
        run: python main.py

      - name: Check generated files
        run: |
          ls -la *.txt 2>/dev/null || echo "No txt files in root directory"

      - name: Checkout target repository
        run: |
          TARGET_URL="https://${{ secrets.BOT }}:x-oauth-basic@github.com/${{ secrets.TARGET_REPO }}.git"
          echo "Cloning target repository from $TARGET_URL (sensitive info masked)"
          git clone "$TARGET_URL" target-repo
          cd target-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Copy generated files to target repository
        run: |
          shopt -s extglob
          for file in *.txt; do
            if [[ "$file" != "requirements.txt" ]]; then
              cp "$file" target-repo/ 2>/dev/null || true
            fi
          done
          ls -la target-repo/*.txt 2>/dev/null || echo "No txt files copied to target repository"

      - name: Commit and push to target repository
        run: |
          cd target-repo
          git add *.txt
          if git diff --staged --quiet; then
            echo "No changes to commit in target repository"
          else
            git commit -m "Update node files"
            TARGET_URL="https://${{ secrets.BOT }}:x-oauth-basic@github.com/${{ secrets.TARGET_REPO }}.git"
            git push "$TARGET_URL"
            echo "Successfully pushed changes to target repository"
          fi
        continue-on-error: true
      -
        name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 2

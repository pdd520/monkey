name: sub_merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2,8,14,20 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 迁出代码
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 安装Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
        
    - name: 加载缓存
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/run_in_Actions/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai'
      
    - name: 安装依赖
      run: |
        pip install pybase64 requests tqdm pyyaml qqwry-py3 chardet beautifulsoup4
        
    - name: 执行任务
      run: |
        python config/TG_proxy.py
        
    - name: 克隆目标仓库
      run: |
        TARGET_URL="https://${{ secrets.BOT }}:x-oauth-basic@github.com/${{ secrets.TARGET_REPO }}.git"
        echo "Cloning target repository from $TARGET_URL (sensitive info masked)"
        git clone "$TARGET_URL" target-repo

    - name: 复制文件到目标仓库
      run: |
        # 确保目标目录存在
        mkdir -p target-repo/sub/
        # 复制所有生成的文件
        cp -r ./sub/* target-repo/sub/

    - name: 提交并推送到目标仓库
      run: |
        cd target-repo
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ./sub/*
        if git diff --staged --quiet; then
          echo "No changes to commit in target repository"
        else
          git commit -m "$(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "Successfully pushed changes to target repository"
        fi
      continue-on-error: true

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2

name: sub_merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2,8,14,20 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 迁出代码
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 安装Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
        
    - name: 加载缓存
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/run_in_Actions/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai'
      
    - name: 安装依赖
      run: |
        pip install pybase64 requests tqdm pyyaml qqwry-py3 chardet beautifulsoup4
        
    - name: 执行任务
      run: |
        python config/TG_proxy.py
        
    - name: 配置Git用户
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
    - name: 提交更改
      run: |                 
        git add ./sub/*
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "$(date '+%Y-%m-%d %H:%M:%S')"
        fi
        
    - name: 推送到远程仓库
      run: |
        TARGET_URL="https://${{ secrets.BOT }}:x-oauth-basic@github.com/${{ secrets.TARGET_REPO }}.git"
        git push "$TARGET_URL" HEAD:main
        echo "Successfully pushed changes to remote repository"
      continue-on-error: true

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
